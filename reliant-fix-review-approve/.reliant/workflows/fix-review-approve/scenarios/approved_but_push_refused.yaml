name: approved_but_push_refused
description: A person approves, but git_publish refuses the push; the run fails and says why
inputs:
  publish_repo: you/reliant-workflow-demo
events:
  - node: tests
    output: {exit_code: 1, stdout: "--- FAIL\n"}
  - node: workspace
    output: {path: /w/fix-run, branch: worktree/fix-run}
  - node: attempts.fix_loop.fix
    black_box: true
    output: {response_text: "Fixed."}
  - node: attempts.fix_loop.verify
    output: {exit_code: 0}
  - node: guard
    output: {exit_code: 0}
  - node: changes
    output: {exit_code: 0, stdout: " M pricing/pricing.go\n"}
  - node: review
    black_box: true
    output:
      completed: true
      response: {verdict: approve, summary: "Minimal and correct."}
  - node: approve
    output: {approval_id: appr-r, status: approved}
  - node: publish
    output: {pushed: false, refused: true, refusal: "the Reliant GitHub App is not installed on you/reliant-workflow-demo"}
expect:
  outcome: failed
  completed: [publish, not_pushed]
  not_reached: [published, kept_local]
  messages:
    not_pushed:
      content_contains: ["GitHub App is not installed"]
